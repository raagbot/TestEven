labels: ["Under Review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Even Realities. Give your request a short title above, one idea per post, and search first: if someone has already asked for this, upvote and comment there instead.
  - type: textarea
    id: request
    attributes:
      label: Your request
      description: Describe what you'd like us to build or improve, and why it matters to you.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - G2 Glasses Hardware
        - G1 Glasses Hardware
        - R1 Ring Hardware
        - Enterprise & Business
        - Community & Events
        - Developer Monetization
        - 3rd-Party Apps
        - Even Hub Developer Platform & SDK
        - Core Glasses Features
        - Companion App & Connectivity
    validations:
      required: true
